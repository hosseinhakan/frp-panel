# ci.yml — quality gate for every push and pull request.
# Mirrors the local commands from README "Quick checks".
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash syntax gate
        run: |
          bash -n frp-setup.sh
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning frp-setup.sh scripts/*.sh
      - name: heredoc/asset sync (CLI == canonical embedded assets)
        run: ./scripts/check-sync.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      - name: linux build (amd64)
        working-directory: panel
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/frp-panel
      - name: windows build (host smoke support)
        working-directory: panel
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath ./cmd/frp-panel
