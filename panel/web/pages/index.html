                  <template x-if="raw.saved"><div class="notice accent mt05"><span class="mono" x-text="raw.saved"></span></div></template>
                  <div class="modal-foot">
                    <button class="btn ghost" @click="raw = null">Close</button>
                    <button class="btn primary" :disabled="raw.busy" @click="saveRaw()">Save (verify + .bak)</button>
                  </div>
                </div>
              </div>
            </template>
          </section>
        </template>

        <!-- ================= GRE Tunnels ================= -->
        <template x-if="view === 'gre'">
          <section x-data="greView">
            <div class="viewhead">
              <div>
                <h1>GRE Tunnels</h1>
                <p>Kernel GRE links in <span class="mono">/root/frp/gre/*.env</span>, run as <span class="mono">gre-tunnel@&lt;name&gt;</span> — proto&nbsp;47, conntrack bypass, MSS clamped. In the reverse topology the Iran entry node is <span class="mono">10.100.111.2</span> and the Foreign exit node is <span class="mono">10.100.111.1</span>; use the Dashboard quick setup to create both sides at once.</p>
              </div>
              <div class="grow"></div>
              <button class="btn primary" @click="openCreate()">+ New tunnel</button>
            </div>

            <template x-if="loading"><p class="muted">loading…</p></template>

            <template x-if="!loading && !tunnels.length">
              <div class="empty">
                <div class="empty-ico">⇄</div>
                <p>No tunnel defined on this node. Create one here, then copy the mirror config to the peer VPS.</p>
                <button class="btn primary" @click="openCreate()">Create the first tunnel</button>
              </div>
            </template>

            <div class="grid grid-2">
              <template x-for="t in tunnels" :key="t.name">
                <div class="svc">
                  <div class="svc-top">
                    <span class="pill" :class="FRP.unitPill(t.status.unitActive)"><span class="dot"></span><span x-text="t.status.unitActive"></span></span>
                    <span class="svc-name" x-text="t.iface"></span>
                    <div class="grow"></div>
                    <span class="pill" :class="t.status.ifaceUp ? 'ok' : 'idle'" x-text="t.status.ifaceUp ? 'iface up' : 'iface down'"></span>
                  </div>
                  <dl class="kv">
                    <dt>local</dt><dd x-text="t.local_public_ip + ' → ' + t.local_private_ip"></dd>
                    <dt>remote</dt><dd x-text="t.remote_public_ip + ' → ' + t.remote_private_ip"></dd>
                    <dt>mtu / mss</dt><dd x-text="t.mtu + ' / ' + t.mss_mode"></dd>
                    <dt>rx / tx</dt>
                    <dd>
                      <span x-text="FRP.fmtBytes(t.status.rxBytes) + ' / ' + FRP.fmtBytes(t.status.txBytes)"></span>
                      <span class="faint" x-text="' (' + t.status.rxPackets + '/' + t.status.txPackets + ' pkts)'"></span>
                    </dd>
                  </dl>
                  <div class="svc-actions">
                    <button class="btn tiny" @click="linkTest(t)">link test</button>
                    <button class="btn tiny" @click="openMirror(t)">mirror config</button>
                    <button class="btn tiny danger" @click="remove(t)">delete</button>
                  </div>
                </div>
              </template>
            </div>

            <template x-if="Object.keys(unreadable).length">
              <div class="notice warn mt1">
                <span class="mono small" x-text="'unreadable env files: ' + Object.keys(unreadable).join(', ')"></span>
              </div>
            </template>

            <!-- create form -->
            <template x-if="form">
              <div class="modal-back" @keydown.escape.window="form = null">
                <form class="modal" @submit.prevent="create()">
                  <div class="modal-head"><h2>New GRE tunnel</h2></div>
                  <div class="field-row">
                    <div class="field">
                      <label>Tunnel / interface name</label>
                      <input class="input mono" x-model="form.name" placeholder="gt11">
                    </div>
                    <div class="field">
                      <label>MTU</label>
                      <input class="input mono" type="number" x-model="form.mtu">
                    </div>
                    <div class="field">
                      <label>MSS mode</label>
                      <select class="select" x-model="form.mssMode">
                        <option value="clamp">clamp to pmtu (recommended)</option>
                        <option value="1360">set-mss 1360</option>
                        <option value="1240">set-mss 1240</option>
                        <option value="1220">set-mss 1220</option>
                        <option value="off">off</option>
                      </select>
                    </div>
                  </div>
                  <div class="field-row mt05">
                    <div class="field">
                      <label>This node — public IP</label>
                      <input class="input mono" x-model="form.localPublicIp" placeholder="1.2.3.4">
                    </div>
                    <div class="field">
                      <label>Peer node — public IP</label>
                      <input class="input mono" x-model="form.remotePublicIp" placeholder="5.6.7.8">
                    </div>
                  </div>
                  <div class="field-row mt05">
                    <div class="field">
                      <label>This node — private IP (CIDR)</label>
                      <input class="input mono" x-model="form.localPrivateIp" placeholder="auto — e.g. 10.100.111.1/30">
                    </div>
                    <div class="field">
                      <label>Peer node — private IP (CIDR)</label>
                      <input class="input mono" x-model="form.remotePrivateIp" placeholder="auto — e.g. 10.100.111.2/30">
                    </div>
                  </div>
                  <p class="faint small">Leave both private IPs blank to auto-suggest the next free 10.100.x.y/30 pair.</p>
                  <template x-if="form.error"><div class="notice bad mt05"><span x-text="form.error"></span></div></template>
                  <div class="modal-foot">
                    <button type="button" class="btn ghost" @click="form = null">Cancel</button>
                    <button type="submit" class="btn primary" :disabled="form.busy">Create tunnel</button>
                  </div>
                </form>
              </div>
            </template>

            <!-- link test -->
            <template x-if="test">
              <div class="modal-back" @keydown.escape.window="test = null">
                <div class="modal">
                  <div class="modal-head"><h2 x-text="'Link test — ' + test.name"></h2></div>
                  <template x-if="test.running"><p class="muted">pinging the peer through the tunnel (3 probes)…</p></template>
                  <template x-if="test.result && !test.result.error">
                    <div>
                      <div class="row mb05">
                        <span class="pill" :class="test.result.reachable ? 'ok' : 'bad'"
                              x-text="test.result.reachable ? 'peer reachable' : 'peer unreachable'"></span>
                        <template x-if="test.result.rtt_ms !== undefined">
                          <span class="pill accent" x-text="'avg ' + FRP.fmtRtt(test.result.rtt_ms)"></span>
                        </template>
                        <template x-if="test.result.loss_pct !== undefined">
                          <span class="pill" :class="test.result.loss_pct > 0 ? 'warn' : 'ok'" x-text="test.result.loss_pct + '% loss'"></span>
                        </template>
                      </div>
                      <dl class="kv">
                        <dt>through</dt><dd x-text="test.result.iface + ' → ' + test.result.peer"></dd>
                        <dt>rx / tx</dt><dd x-text="FRP.fmtBytes(test.result.rx_bytes) + ' / ' + FRP.fmtBytes(test.result.tx_bytes)"></dd>
                      </dl>
                      <pre class="logpane mt05" x-text="test.result.output"></pre>
                    </div>
                  </template>
                  <template x-if="test.result && test.result.error">
                    <div class="notice bad"><span x-text="test.result.error"></span></div>
                  </template>
                  <div class="modal-foot">
                    <button class="btn primary" @click="test = null">Close</button>
                  </div>
                </div>
              </div>
            </template>

            <!-- mirror config -->
            <template x-if="mirror">
              <div class="modal-back" @keydown.escape.window="mirror = null">
                <div class="modal">
                  <div class="modal-head">
                    <h2 x-text="'Mirror config — ' + mirror.name"></h2>
                    <div class="grow"></div>
                    <button class="btn" @click="copyMirror()">copy</button>
                  </div>
                  <p class="muted small">Save this as the peer node's tunnel definition — the same six fields, local/remote swapped.</p>
                  <pre class="logpane" x-text="mirror.env"></pre>
                  <div class="modal-foot">
                    <button class="btn primary" @click="mirror = null">Done</button>
                  </div>
                </div>
              </div>
            </template>
          </section>
        </template>

        <!-- ================= Turbo ================= -->
        <template x-if="view === 'turbo'">
          <section x-data="turboView">
            <div class="viewhead">
              <div>
                <h1>Turbo</h1>
                <p>Persistent kernel tuning for long-haul tunnels — BBR + fq, deep socket buffers, ZRAM swap.</p>
              </div>
            </div>

            <template x-if="!state"><p class="muted">reading kernel state…</p></template>

            <div class="grid grid-2">
              <template x-if="state">
                <div class="card">
                  <div class="card-head">
                    <h2>Kernel tuning</h2>
                    <div class="grow"></div>
                    <span class="pill" :class="state.dropin === 'installed' ? 'ok' : 'idle'" x-text="'drop-in ' + state.dropin"></span>
                  </div>
                  <div class="row mb05">
                    <span class="pill" :class="FRP.unitPill(state.units['tunnel-turbo'].active)">
                      <span class="dot"></span><span x-text="'tunnel-turbo ' + state.units['tunnel-turbo'].active"></span>
                    </span>
                    <span class="pill idle" x-text="'boot: ' + state.units['tunnel-turbo'].enabled"></span>
                  </div>
                  <template x-if="sysctlRows.length">
                    <div class="tblwrap">
                      <table class="tbl">
                        <thead><tr><th>live sysctl</th><th class="num">value</th></tr></thead>
                        <tbody>
                          <template x-for="row in sysctlRows" :key="row.k">
                            <tr>
                              <td class="mono" x-text="row.k"></td>
                              <td class="num" x-text="row.v"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                  <template x-if="!sysctlRows.length">
                    <p class="muted small">No live values yet — the frp-turbo helper appears after the first apply.</p>
                  </template>
                  <div class="btn-row mt1">
                    <button class="btn okbtn" :disabled="busy" @click="apply()">Apply turbo</button>
                    <button class="btn danger" :disabled="busy" @click="revert()">Revert</button>
                  </div>
                  <p class="faint small mt05">TCP+UDP GC cron for frps/frpc is preserved inside the drop-in apply path.</p>
                </div>
              </template>

              <template x-if="state">
                <div class="card">
                  <div class="card-head">
                    <h2>ZRAM swap</h2>
                    <div class="grow"></div>
                    <template x-if="zramActive">
                      <span class="pill ok"><span class="dot live"></span><span x-text="'active · prio ' + zramActive.priority"></span></span>
                    </template>
                    <template x-if="!zramActive">
                      <span class="pill idle">not active</span>
                    </template>
                  </div>
                  <template x-if="zramConfig">
                    <dl class="kv">
                      <dt>configured</dt><dd x-text="zramConfig.SizeMB + ' MB · ' + zramConfig.Algo"></dd>
                      <template x-if="zramActive">
                        <dt>live</dt><dd x-text="zramActive.name + ' · ' + fmtBytes(zramActive.size_bytes) + ' (' + fmtBytes(zramActive.used_bytes) + ' used)'"></dd>
                      </template>
                    </dl>
                  </template>
                  <template x-if="!zramConfig">
                    <p class="muted small">ZRAM is not configured on this node yet.</p>
                  </template>
                  <div class="field-row mt1">
                    <div class="field">
                      <label>Size (MB)</label>
                      <select class="select mono" x-model.number="zramSize">
                        <template x-for="s in zramSizes" :key="s">
                          <option :value="s" x-text="s + ' MB'"></option>
                        </template>
                      </select>
                    </div>
                    <div class="field">
                      <label>Algorithm</label>
                      <select class="select mono" x-model="zramAlgo">
                        <template x-for="a in zramAlgos" :key="a">
                          <option :value="a" x-text="a"></option>
                        </template>
                      </select>
                    </div>
                  </div>
                  <div class="row mt1">
                    <button class="btn okbtn" :disabled="busy" @click="zramOn()">Enable ZRAM</button>
                    <button class="btn danger" :disabled="busy || !zramActive" @click="zramOff()">Disable</button>
                    <span class="pill idle" :class="FRP.unitPill(state.units['frp-zram'].active)" x-text="'frp-zram ' + state.units['frp-zram'].active"></span>
                  </div>
                </div>
              </template>
            </div>
          </section>
        </template>

        <!-- ================= Logs ================= -->
        <template x-if="view === 'logs'">
          <section x-data="logsView">
            <div class="viewhead">
              <div>
                <h1>Logs</h1>
                <p>Live <span class="mono">journalctl -f</span> over SSE — suite units only, strictly whitelisted server-side.</p>
              </div>
            </div>

            <div class="logbar">
              <div class="field">
                <label>Unit</label>
                <select class="select mono" x-model="unit" :disabled="!units.length" @change="restart()">
                  <template x-for="u in units" :key="u">
                    <option :value="u" x-text="u"></option>
                  </template>
                </select>
              </div>
              <div class="field">
                <label>Tail lines</label>
                <select class="select mono" x-model.number="lines" @change="restart()">
                  <template x-for="n in lineOpts" :key="n">
                    <option :value="n" x-text="n"></option>
                  </template>
                </select>
              </div>
              <div class="field">
                <label>Filter</label>
                <select class="select" x-model="$store.logs.filter">
                  <option value="all">all lines</option>
                  <option value="warn">warnings + errors</option>
                  <option value="error">errors only</option>
                </select>
              </div>
              <div class="grow"></div>
              <template x-if="started">
                <button class="btn" :class="$store.logs.paused ? 'primary' : ''" @click="$store.logs.paused = !$store.logs.paused"
                        x-text="$store.logs.paused ? '▶ resume' : '⏸ pause'"></button>
              </template>
              <button class="btn" @click="clear()">clear</button>
              <label class="check"><input type="checkbox" x-model="$store.logs.follow"> follow</label>
            </div>

            <!-- htmx sse transport (hidden): the extension owns the
                 EventSource; app.js taps payloads directly from it. -->
            <div x-ref="stream" class="hidden" hx-ext="sse">
              <div sse-swap="message,open,eof,overflow" hx-swap="none"></div>
            </div>

            <div class="logpane" x-ref="pane" role="log" aria-live="polite"
                 @scroll="$store.logs.follow = ($el.scrollTop + $el.clientHeight) > ($el.scrollHeight - 60)"
                 x-effect="$store.logs.lines.length; scrollEnd()">
              <template x-if="store.streamNote">
                <div class="streamnote" x-text="store.streamNote"></div>
              </template>
              <template x-for="(l, i) in store.visible()" :key="i">
                <div class="ln" :class="l.cls"><span class="ts" x-text="l.ts"></span><span x-text="l.text"></span></div>
              </template>
              <template x-if="!store.lines.length">
                <div class="streamnote" x-text="started ? 'waiting for log lines…' : 'no unit selected — create an instance first.'"></div>
              </template>
            </div>

            <div class="row mt05">
              <span class="pill" :class="store.connected ? 'ok' : 'warn'">
                <span class="dot" :class="{ live: store.connected }"></span>
                <span x-text="store.connected ? 'streaming' : 'disconnected'"></span>
              </span>
              <span class="pill idle" x-text="store.lines.length + ' lines buffered'"></span>
              <span class="pill idle" x-text="'paused — ' + $store.logs.paused"></span>
            </div>
          </section>
        </template>

        <!-- ================= Stats ================= -->
        <template x-if="view === 'stats'">
          <section x-data="statsView">
            <div class="viewhead">
              <div>
                <h1>Stats</h1>
                <p>Scraped from each instance's FRP webServer — active connections and per-proxy traffic, with a 24&nbsp;h history.</p>
              </div>
              <div class="grow"></div>
              <select class="select mono" x-model="selected" @change="renderChart()">
                <template x-for="i in instances" :key="i.name">
                  <option :value="i.name" x-text="i.name + ' (' + i.kind + ')'"></option>
                </template>
              </select>
            </div>

            <template x-if="loading"><p class="muted">loading…</p></template>

            <template x-if="!loading && !instances.length">
              <div class="empty">
                <div class="empty-ico">∿</div>
                <p>No instance reports metrics yet. Stats appear once an frps/frpc with its webServer block is running.</p>
              </div>
            </template>

            <template x-if="cur">
              <div class="stack">
                <div class="statgrid">
                  <div class="stat">
                    <div class="stat-label">status</div>
                    <div class="stat-value">
                      <span class="pill" :class="cur.up ? 'ok' : 'bad'" x-text="cur.up ? 'up' : 'down'"></span>
                    </div>
                    <div class="stat-sub mono" x-text="cur.error || (cur.version ? 'frp ' + cur.version : '')"></div>
                  </div>
                  <div class="stat">
                    <div class="stat-label">connections</div>
                    <div class="stat-value" x-text="cur.cur_conns"></div>
                    <div class="stat-sub" x-show="cur.kind === 'server'" x-text="'clients: ' + (cur.client_counts || 0)"></div>
                  </div>
                  <div class="stat">
                    <div class="stat-label">traffic in</div>
                    <div class="stat-value" x-text="fmtBytes(cur.total_traffic_in)"></div>
                    <div class="stat-sub">total</div>
                  </div>
                  <div class="stat">
                    <div class="stat-label">traffic out</div>
                    <div class="stat-value" x-text="fmtBytes(cur.total_traffic_out)"></div>
                    <div class="stat-sub">total</div>
                  </div>
                </div>

                <div class="card">
                  <div class="card-head"><h2 x-text="'24 h traffic — ' + cur.name"></h2></div>
                  <template x-if="curHistory.length">
                    <div class="chart" x-ref="chart"></div>
                  </template>
                  <template x-if="!curHistory.length">
                    <p class="muted small">History builds up here at one sample per minute — check back shortly.</p>
                  </template>
                </div>

                <div class="card">
                  <div class="card-head"><h2>Proxies</h2></div>
                  <template x-if="!cur.proxies.length">
                    <p class="muted small">No proxies registered on this instance.</p>
                  </template>
                  <template x-if="cur.proxies.length">
                    <div class="tblwrap">
                      <table class="tbl">
                        <thead>
                          <tr><th>proxy</th><th>type</th><th>status</th><th class="num">conns</th><th class="num">today in</th><th class="num">today out</th></tr>
                        </thead>
                        <tbody>
                          <template x-for="p in cur.proxies" :key="p.name">
                            <tr>
                              <td class="mono" x-text="p.name"></td>
                              <td><span class="badge" :class="p.type === 'udp' ? 'udp' : 'tcp'" x-text="p.type.toUpperCase()"></span></td>
                              <td>
                                <span class="pill" :class="p.status === 'running' ? 'ok' : 'warn'" x-text="p.status"></span>
                                <template x-if="p.err"><span class="faint small" x-text="p.err"></span></template>
                              </td>
                              <td class="num" x-text="p.cur_conns"></td>
                              <td class="num" x-text="fmtBytes(p.today_traffic_in)"></td>
                              <td class="num" x-text="fmtBytes(p.today_traffic_out)"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </section>
        </template>

        <!-- ================= Backup ================= -->
        <template x-if="view === 'backup'">
          <section x-data="backupView">
            <div class="viewhead">
              <div>
                <h1>Backup &amp; restore</h1>
                <p>ZIP snapshots of the suite's state. Redacted exports regenerate fresh secrets on restore.</p>
              </div>
            </div>

            <div class="grid grid-2">
              <div class="card">
                <div class="card-head"><h2>Export</h2></div>
                <p class="muted small">
                  Contains FRP TOMLs, GRE envs, systemd units and turbo files. Without secrets,
                  <span class="mono">auth.token</span> / webServer passwords are replaced by
                  <span class="mono">REDACTED</span> and panel credentials are excluded — a restore
                  regenerates fresh random values.
                </p>
                <label class="check mt05">
                  <input type="checkbox" x-model="includeSecrets">
                  include secrets (tokens, webServer passwords, panel.toml)
                </label>
                <button class="btn primary mt1" :disabled="exporting" @click="doExport()">
                  <span x-text="exporting ? 'packing…' : '⤓ Download backup ZIP'"></span>
                </button>
              </div>

              <div class="card">
                <div class="card-head"><h2>Restore</h2></div>
                <div class="dropzone" :class="{ over: overDrag }"
                     @click="$refs.file.click()"
                     @dragover.prevent="overDrag = true"
                     @dragleave="overDrag = false"
                     @drop.prevent="onDrop($event)">
                  <template x-if="!file">
                    <div>
                      <p>Drop a backup .zip here, or click to choose.</p>
                      <p class="faint small">validated in full before anything is written</p>
                    </div>
                  </template>
                  <template x-if="file">
                    <p><span class="mono" x-text="file.name"></span> — <span x-text="FRP.fmtBytes(file.size)"></span></p>
                  </template>
                  <input x-ref="file" type="file" accept=".zip" class="hidden" @change="pickFile($event)">
                </div>

                <p class="navgroup-label mt1">categories to restore</p>
                <div class="row">
                  <template x-for="c in categories" :key="c.id">
                    <label class="check" :title="c.hint">
                      <input type="checkbox" x-model="c.on">
                      <span x-text="c.label"></span>
                    </label>
                  </template>
                </div>
                <div class="row mt05">
                  <label class="check"><input type="checkbox" x-model="restartAfter"> restart affected active units</label>
                  <label class="check"><input type="checkbox" x-model="regenerate"> regenerate redacted secrets</label>
                </div>

                <button class="btn primary mt1" :disabled="!file || importing" @click="doImport()">
                  <span x-text="importing ? 'restoring…' : 'Restore from ZIP'"></span>
                </button>

                <template x-if="error"><div class="notice bad mt05"><span x-text="error"></span></div></template>

                <template x-if="result">
                  <div class="mt1">
                    <div class="notice accent">
                      <span x-text="Object.keys(result.summary.restored || {}).length + ' files restored · ' + (result.summary.backups || []).length + ' backups taken'"></span>
                    </div>
                    <template x-if="result.summary.regenerated && result.summary.regenerated.length">
                      <p class="muted small mt05" x-text="'fresh secrets regenerated in: ' + result.summary.regenerated.join(', ')"></p>
                    </template>
                    <template x-if="result.notes && result.notes.length">
                      <div class="stack mt05">
                        <template x-for="(n, i) in result.notes" :key="i">
                          <div class="notice warn"><span x-text="n"></span></div>
                        </template>
                      </div>
                    </template>
                    <details class="mt05">
                      <summary class="muted small">restored file list</summary>
                      <div class="tblwrap mt05">
                        <table class="tbl">
                          <tbody>
                            <template x-for="e in restoredEntries()" :key="e.entry">
                              <tr><td class="mono" x-text="e.entry"></td><td class="mono muted" x-text="e.path"></td></tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </details>
                  </div>
                </template>
              </div>
            </div>
          </section>
        </template>

        <!-- ================= Watchdog ================= -->
        <template x-if="view === 'watchdog'">
          <section x-data="watchdogView">
            <div class="viewhead">
              <div>
                <h1>Watchdog</h1>
                <p>Dual-layer auto-heal: GRE peer probes (layer 1) plus FRP control-channel and proxy health (layer 2). Defaults: 15s interval, 3 strikes, 60s cooldown.</p>
              </div>
            </div>

            <div class="grid grid-2">
              <template x-if="form">
                <div class="card">
                  <div class="card-head">
                    <h2>Configuration</h2>
                    <div class="grow"></div>
                    <template x-if="state && state.unit">
                      <span class="pill" :class="FRP.unitPill(state.unit.active)" x-text="'frp-watchdog ' + state.unit.active"></span>
                    </template>
                  </div>
                  <div class="row mb05">
                    <label class="switch">
                      <input type="checkbox" x-model="form.enabled">
                      <span class="track"></span>
                      <span x-text="form.enabled ? 'enabled' : 'disabled'"></span>
                    </label>
                  </div>
                  <div class="field-row">
                    <div class="field">
                      <label>Check interval (s)</label>
                      <input class="input mono" type="number" min="10" x-model.number="form.interval">
                    </div>
                    <div class="field">
                      <label>Failures before restart</label>
                      <input class="input mono" type="number" min="1" x-model.number="form.threshold">
                    </div>
                    <div class="field">
                      <label>Cooldown (s)</label>
                      <input class="input mono" type="number" min="0" x-model.number="form.cooldown">
                    </div>
                  </div>
                  <div class="field-row mt05">
                    <div class="field">
                      <label>Ping timeout (s)</label>
                      <input class="input mono" type="number" min="1" x-model.number="form.pingTimeout">
                    </div>
                    <div class="field">
                      <label>TCP probe timeout (s)</label>
                      <input class="input mono" type="number" min="1" x-model.number="form.tcpTimeout">
                    </div>
                  </div>

                  <p class="navgroup-label mt1">
                    Telegram alerts (optional)
                    <span class="pill" :class="telegramEnabled ? 'ok' : 'idle'" x-text="telegramEnabled ? 'configured' : 'off'"></span>
                  </p>
                  <div class="field-row">
                    <div class="field">
                      <label>Bot token</label>
                      <input class="input mono" type="password" autocomplete="new-password"
                             x-model="form.tgBotToken"
                             :placeholder="form.tgTokenMasked ? 'configured ' + form.tgTokenMasked + ' — blank keeps it' : '123456:ABC…'">
                    </div>
                    <div class="field">
                      <label>Chat ID</label>
                      <input class="input mono" x-model="form.tgChatId" placeholder="-100… or @channel">
                    </div>
                  </div>
                  <div class="field mt05">
                    <label>API base (optional — use a Worker proxy where Telegram is blocked)</label>
                    <input class="input mono" x-model="form.tgApiBase" placeholder="https://api.telegram.org">
                  </div>
                  <label class="check mt05">
                    <input type="checkbox" x-model="form.clearTelegram">
                    Clear the stored Telegram token and chat ID
                  </label>
                  <div class="btn-row mt05">
                    <button type="button" class="btn" :disabled="tgBusy" @click="testTelegram()">
                      Send test alert
                    </button>
                    <span class="faint small">Delivery is best-effort and never blocks the heal loop.</span>
                  </div>

                  <p class="faint small mt05">Values merge over the current env; invalid entries are rejected, never silently defaulted.</p>
                  <button class="btn primary mt1" :disabled="busy" @click="save()">Save &amp; apply</button>
                </div>
              </template>

              <div class="card">
                <div class="card-head">
                  <h2>Heal events</h2>
                  <div class="grow"></div>
                  <span class="pill idle" x-text="events.length + ' recent'"></span>
                </div>
                <template x-if="!events.length">
                  <p class="muted small">Nothing healed (or broken) so far — the log lives in <span class="mono">/var/log/frp-panel/watchdog.log</span>.</p>
                </template>
                <template x-if="events.length">
                  <pre class="logpane" x-text="events.join('\n')"></pre>
                </template>
              </div>
            </div>
          </section>
        </template>

      </main>
    </div>
  </div>

  <!-- ============ confirm dialog (shared) ============ -->
  <template x-if="$store.ui.confirmState.open">
    <div class="modal-back" @keydown.escape.window="$store.ui.answer(false)">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head"><h2 x-text="$store.ui.confirmState.title"></h2></div>
        <p class="muted" x-text="$store.ui.confirmState.message"></p>
        <div class="modal-foot">
          <button class="btn ghost" @click="$store.ui.answer(false)">Cancel</button>
          <button class="btn" :class="$store.ui.confirmState.danger ? 'danger' : 'primary'"
                  @click="$store.ui.answer(true)" x-text="$store.ui.confirmState.confirmText"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ toasts ============ -->
  <div class="toasts" role="status" aria-live="polite">
    <template x-for="t in $store.ui.toasts" :key="t.id">
      <div class="toast" :class="t.kind">
        <span class="t-ico" x-text="t.kind === 'ok' ? '✓' : (t.kind === 'warn' ? '⚠' : '✕')"></span>
        <span x-text="t.msg"></span>
        <button class="iconbtn" @click="$store.ui.dismiss(t.id)">×</button>
      </div>
    </template>
  </div>

</body>
</html>
