<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FRP Panel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/uPlot.min.css">
  <!-- htmx: no indicator <style> injection (kept CSP-clean: style-src 'self') -->
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <script src="/static/js/vendor/htmx.min.js" defer></script>
  <script src="/static/js/vendor/htmx-sse.min.js" defer></script>
  <script src="/static/js/vendor/uPlot.min.js" defer></script>
  <!-- app.js must load before Alpine: it registers the alpine:init
       component factories, and Alpine may start as soon as it loads -->
  <script src="/static/js/app.js" defer></script>
  <script src="/static/js/vendor/alpine.min.js" defer></script>
</head>
<body x-data="shell" x-cloak>

  <!-- Shell-owned latency prober hub: persistent across views, feeding the
       $store.latency chart data. The stream is opened from shell.init() via
       FRP.sse — htmx's sse extension owns the EventSource lifecycle and
       payloads are tapped directly in app.js. -->
  <div id="sse-latency" class="hidden" hx-ext="sse">
    <div sse-swap="snapshot,sample" hx-swap="none"></div>
  </div>

  <div class="shell">

    <!-- ============ sidebar ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">⇄</div>
        <div>
          <div class="brand-name">FRP Panel</div>
          <div class="brand-sub">Tunnel &amp; FRP Management Suite</div>
        </div>
      </div>

      <div class="navwrap">
        <template x-for="g in navGroups" :key="g.label">
          <div class="navgroup">
            <div class="navgroup-label" x-text="g.label"></div>
            <template x-for="v in viewsInGroup(g.filter)" :key="v.id">
              <button class="navitem" :class="{ active: view === v.id }" @click="nav(v.id)">
                <span class="nav-ico" x-text="v.ico"></span>
                <span x-text="v.label"></span>
              </button>
            </template>
          </div>
        </template>
      </div>

      <div class="sidefoot">
        <div class="rowline"><span class="faint">panel</span><span class="mono" x-text="'v' + (health.version || '…')"></span></div>
        <div class="rowline"><span class="faint">uptime</span><span class="mono" x-text="FRP.fmtUptime(health.uptime_seconds)"></span></div>
      </div>
    </aside>

    <!-- ============ main column ============ -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-title" x-text="(views.find(v => v.id === view) || {}).label || ''"></div>
        <div class="spacer"></div>
        <span class="pill" :class="$store.latency.connected ? 'ok' : 'warn'">
          <span class="dot" :class="{ live: $store.latency.connected }"></span>
          <span x-text="$store.latency.connected ? 'latency live' : 'latency off'"></span>
        </span>
        <span class="pill idle" x-show="me" x-cloak x-text="'user: ' + (me ? me.username : '')"></span>
        <button class="btn ghost sm" @click="logout()">Sign out</button>
      </header>

      <main class="content">

        <!-- ================= Dashboard ================= -->
        <template x-if="view === 'dashboard'">
          <section x-data="dashboardView">
            <div class="viewhead">
              <div>
                <h1>Dashboard</h1>
                <p>Live tunnel, service and traffic state — the same files and units the CLI manages.</p>
              </div>
              <div class="grow"></div>
              <span class="pill" :class="turboOn ? 'ok' : 'idle'" x-text="turboOn ? 'BBR+fq turbo on' : 'turbo off'"></span>
              <span class="pill" :class="zramOn ? 'ok' : 'idle'" x-text="zramOn ? 'zram active' : 'zram off'"></span>
            </div>

            <div class="statgrid mb1">
              <div class="stat">
                <div class="stat-label">active FRP connections</div>
                <div class="stat-value" x-text="totalConns"></div>
                <div class="stat-sub" x-text="statsUp.length + ' of ' + stats.length + ' instances up'"></div>
              </div>
              <div class="stat">
                <div class="stat-label">traffic in</div>
                <div class="stat-value" x-text="FRP.fmtBytes(totalIn)"></div>
                <div class="stat-sub">sum over instances</div>
              </div>
              <div class="stat">
                <div class="stat-label">traffic out</div>
                <div class="stat-value" x-text="FRP.fmtBytes(totalOut)"></div>
                <div class="stat-sub">sum over instances</div>
              </div>
              <div class="stat">
                <div class="stat-label">watchdog</div>
                <div class="stat-value" x-text="watchdog && watchdog.unit ? watchdog.unit.active : '—'"></div>
                <div class="stat-sub" x-text="watchdog && watchdog.config ? 'every ' + watchdog.config.interval + 's' : 'not configured'"></div>
              </div>
            </div>

            <div class="card mb1">
              <div class="card-head">
                <h2>FRP over GRE Reverse — Quick Setup</h2>
                <div class="grow"></div>
                <span class="pill accent">one wizard · GRE + FRP</span>
              </div>
              <p class="muted small mb05">
                Iran is the <strong>entry bridge</strong>: <span class="mono">frps</span> listens only on
                <span class="mono">10.100.111.2</span> (gt11) and users connect to the Iran public IP.
                Foreign is the <strong>exit backend</strong>: <span class="mono">frpc</span> dials back over GRE
                and exposes its local ports.
              </p>
              <pre class="logpane">User ──► Iran Public IP:port ──► frps (Iran, 10.100.111.2) ──► GRE gt11 ──► frpc (Foreign, 10.100.111.1) ──► Foreign 127.0.0.1:port</pre>
              <div class="row mt05">
                <button class="btn primary" @click="openRevWizard()">Start quick setup</button>
                <span class="faint small">Creates gt11, the frps/frpc instance, a 32-char token and the mirror payload.</span>
              </div>
            </div>

            <div class="grid grid-2">
              <!-- live latency -->
              <div class="card">
                <div class="card-head">
                  <h2>Link latency</h2>
                  <div class="grow"></div>
                  <span class="muted small" x-text="'sampled every ' + $store.latency.intervalSec + 's · ICMP + TCP RTT'"></span>
                </div>
                <template x-if="$store.latency.order.length">
                  <div>
                    <div class="chart" x-ref="chart"></div>
                    <div class="tblwrap mt05">
                      <table class="tbl">
                        <thead>
                          <tr><th>target</th><th>kind</th><th>host</th><th class="num">rtt</th><th class="num">loss</th><th class="num">samples</th></tr>
                        </thead>
                        <tbody>
                          <template x-for="id in $store.latency.order" :key="id">
                            <tr>
                              <td class="mono" x-text="id"></td>
                              <td><span class="badge" :class="$store.latency.targets[id].kind === 'tcp' ? 'tcp' : ($store.latency.targets[id].kind === 'icmp-tunnel' ? 'udp' : '')" x-text="$store.latency.targets[id].kind"></span></td>
                              <td class="mono muted" x-text="$store.latency.targets[id].host"></td>
                              <td class="num">
                                <span class="pill" :class="$store.latency.targets[id].ok ? 'ok' : 'bad'" x-text="FRP.fmtRtt($store.latency.targets[id].rtt_ms)"></span>
                              </td>
                              <td class="num" x-text="$store.latency.targets[id].loss_pct + '%'"></td>
                              <td class="num" x-text="$store.latency.targets[id].samples"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </template>
                <template x-if="!$store.latency.order.length">
                  <div class="empty">
                    <div class="empty-ico">∿</div>
                    <p>No probe targets yet. Every GRE tunnel adds its peer (public + through-tunnel)
                      and every FRP client adds its control channel here automatically.</p>
                  </div>
                </template>
              </div>

              <!-- service status -->
              <div class="card">
                <div class="card-head"><h2>Services</h2></div>
                <template x-if="!services.length">
                  <div class="empty">
                    <div class="empty-ico">◉</div>
                    <p>No suite units discovered yet. Create a server, client or tunnel to begin.</p>
                  </div>
                </template>
                <div class="stack">
                  <template x-for="g in svcGroups" :key="g.label">
                    <div>
                      <div class="navgroup-label" x-text="g.label"></div>
                      <div class="stack">
                        <template x-for="s in g.items" :key="s.unit">
                          <div class="svc">
                            <div class="svc-top">
                              <span class="pill" :class="pillFor(s.active)"><span class="dot"></span><span x-text="s.active"></span></span>
                              <span class="svc-name" x-text="s.unit"></span>
                              <div class="grow"></div>
                              <span class="svc-meta" x-text="s.enabled"></span>
                            </div>
                            <div class="svc-actions">
                              <button class="btn tiny" @click="unitAction(s.unit, 'start')">start</button>
                              <button class="btn tiny" @click="unitAction(s.unit, 'restart')">restart</button>
                              <button class="btn tiny" @click="unitAction(s.unit, 'stop')">stop</button>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
            <!-- FRP over GRE Reverse quick-setup wizard -->
            <template x-if="rev">
              <div class="modal-back" @keydown.escape.window="rev = null">
                <div class="modal">
                  <div class="modal-head">
                    <h2>FRP over GRE Reverse — Quick Setup</h2>
                    <div class="grow"></div>
                    <span class="pill idle" x-text="rev.step === 'role' ? 'step 1 · role' : (rev.step === 'form' ? 'step 2 · ' + rev.role : 'step 3 · done')"></span>
                  </div>

                  <!-- step 1: role -->
                  <template x-if="rev.step === 'role'">
                    <div>
                      <p class="muted small mb05">
                        Configure the <strong>Iran entry node first</strong>: it prints the mirror payload.
                        Then run this wizard on the Foreign node and paste that payload.
                      </p>
                      <div class="grid grid-2">
                        <div class="card rolecard" role="button" tabindex="0"
                             @click="revPickRole('iran')"
                             @keydown.enter.prevent="revPickRole('iran')"
                             @keydown.space.prevent="revPickRole('iran')">
                          <div class="row">
                            <span class="badge srv">frps</span>
                            <div class="grow"></div>
                            <span class="pill accent">entry · bridge</span>
                          </div>
                          <h3 class="mt05">Iran Node</h3>
                          <p class="muted small">
                            gt11 <span class="mono">10.100.111.2/30</span> · frps bound to
                            <span class="mono">10.100.111.2:7025</span>. Users connect to the
                            <strong>Iran public IP</strong>.
                          </p>
                        </div>
                        <div class="card rolecard" role="button" tabindex="0"
                             @click="revPickRole('foreign')"
                             @keydown.enter.prevent="revPickRole('foreign')"
                             @keydown.space.prevent="revPickRole('foreign')">
                          <div class="row">
                            <span class="badge cli">frpc</span>
                            <div class="grow"></div>
                            <span class="pill accent">exit · backend</span>
                          </div>
                          <h3 class="mt05">Foreign Node</h3>
                          <p class="muted small">
                            gt11 <span class="mono">10.100.111.1/30</span> · frpc dials back to
                            <span class="mono">10.100.111.2:7025</span> and exposes its
                            <span class="mono">127.0.0.1</span> ports.
                          </p>
                        </div>
                      </div>
                      <div class="row mt1">
                        <label class="check">
                          <input type="checkbox" x-model="rev.enableWatchdog">
                          Enable the dual-layer auto-heal watchdog (15s · threshold 3 · 60s cooldown)
                        </label>
                      </div>
                      <p class="faint small mt05">
                        Layer 1 rebuilds dead GRE links and reconnects frpc; layer 2 restarts a frozen
                        frpc session when GRE is healthy but the control channel or proxies stall.
                      </p>
                      <div class="modal-foot">
                        <button type="button" class="btn ghost" @click="rev = null">Cancel</button>
                      </div>
                    </div>
                  </template>

                  <!-- step 2: Iran entry form -->
                  <template x-if="rev.step === 'form' && rev.role === 'iran'">
                    <div>
                      <div class="field-row">
                        <div class="field">
                          <label>Iran public IP (this node)</label>
                          <input class="input mono" x-model="rev.iranPublicIp" placeholder="1.2.3.4">
                        </div>
                        <div class="field">
                          <label>Foreign public IP (exit node)</label>
                          <input class="input mono" x-model="rev.foreignPublicIp" placeholder="5.6.7.8">
                        </div>
                      </div>
                      <div class="field-row mt05">
                        <div class="field">
                          <label>GRE interface</label>
                          <input class="input mono" x-model="rev.iface" placeholder="gt11">
                        </div>
                        <div class="field">
                          <label>GRE subnet (/30)</label>
                          <input class="input mono" x-model="rev.subnet" placeholder="10.100.111.0/30">
                        </div>
                        <div class="field">
                          <label>Tunnel control port</label>
                          <input class="input mono" type="number" min="1" max="65535" x-model.number="rev.controlPort">
                        </div>
                        <div class="field">
                          <label>Protocol</label>
                          <select class="select" x-model="rev.protocol">
                            <option value="tcp">tcp (plain, recommended over GRE)</option>
                            <option value="quic">quic</option>
                            <option value="kcp">kcp</option>
                          </select>
                        </div>
                      </div>
                      <p class="faint small mt05">
                        Creates <span class="mono" x-text="rev.iface || 'gt11'"></span>
                        (<span class="mono" x-text="(rev.subnet || '10.100.111.0/30').replace('.0/30', '.2/30')"></span> ↔
                        <span class="mono" x-text="(rev.subnet || '10.100.111.0/30').replace('.0/30', '.1/30')"></span>, MTU 1400,
                        NOTRACK proto 47, TCPMSS clamp 1240/1220), generates a 32-char token, and binds frps
                        strictly to the tunnel IP so it is invisible on the public internet.
                        Busy interfaces, subnets and ports are re-allocated automatically.
                      </p>
                      <template x-if="rev.error"><div class="notice bad mt05"><span x-text="rev.error"></span></div></template>
                      <div class="modal-foot">
                        <button type="button" class="btn ghost" @click="rev.step = 'role'">Back</button>
                        <button type="button" class="btn primary" :disabled="rev.busy" @click="revRun()">Create entry node</button>
                      </div>
                    </div>
                  </template>

                  <!-- step 2: Foreign exit form -->
                  <template x-if="rev.step === 'form' && rev.role === 'foreign'">
                    <div>
                      <div class="field">
                        <label>Mirror payload from the Iran node</label>
                        <textarea class="input rawedit" x-model="rev.mirrorPayload" spellcheck="false"
                                  placeholder="Paste the IFACE=… TOKEN=… block here"></textarea>
                        <span class="hint">Paste the payload, or leave it empty and fill the fields below.</span>
                      </div>
                      <div class="field-row mt05">
                        <div class="field">
                          <label>Foreign public IP (this node)</label>
                          <input class="input mono" x-model="rev.foreignPublicIp" placeholder="from payload / 5.6.7.8">
                        </div>
                        <div class="field">
                          <label>Iran public IP</label>
                          <input class="input mono" x-model="rev.iranPublicIp" placeholder="from payload / 1.2.3.4">
                        </div>
                        <div class="field">
                          <label>Control port</label>
                          <input class="input mono" type="number" min="1" max="65535" x-model.number="rev.controlPort" placeholder="7025">
                        </div>
                      </div>
                      <div class="field-row mt05">
                        <div class="field">
                          <label>Token</label>
                          <input class="input mono" x-model="rev.token" spellcheck="false" placeholder="from payload">
                        </div>
                        <div class="field">
                          <label>Protocol</label>
                          <select class="select" x-model="rev.protocol">
                            <option value="">from payload / tcp</option>
                            <option value="tcp">tcp</option>
                            <option value="quic">quic</option>
                            <option value="kcp">kcp</option>
                          </select>
                        </div>
                        <div class="field">
                          <label>GRE interface</label>
                          <input class="input mono" x-model="rev.iface" placeholder="from payload / gt11">
                        </div>
                      </div>
                      <div class="field-row mt05">
                        <div class="field">
                          <label>Local ports to expose</label>
                          <input class="input mono" x-model="rev.localPorts" placeholder="8443,2053,443">
                        </div>
                        <div class="field">
                          <label>Emit</label>
                          <select class="select" x-model="rev.proto">
                            <option value="both">TCP + UDP — paired rules per port</option>
                            <option value="tcp">TCP only</option>
                            <option value="udp">UDP only</option>
                          </select>
                        </div>
                        <div class="field">
                          <label>Local IP on this node</label>
                          <input class="input mono" x-model="rev.localIp" placeholder="127.0.0.1">
                        </div>
                      </div>
                      <p class="faint small mt05">
                        Creates the matching gt11 (<span class="mono">10.100.111.1/30 ↔ 10.100.111.2/30</span>)
                        and an frpc instance with TLS + per-proxy encryption, compression off, then pings
                        <span class="mono">10.100.111.2</span> and checks the frpc unit.
                      </p>
                      <template x-if="rev.error"><div class="notice bad mt05"><span x-text="rev.error"></span></div></template>
                      <div class="modal-foot">
                        <button type="button" class="btn ghost" @click="rev.step = 'role'">Back</button>
                        <button type="button" class="btn primary" :disabled="rev.busy" @click="revRun()">Create exit node + test link</button>
                      </div>
                    </div>
                  </template>

                  <!-- step 3: result -->
                  <template x-if="rev.step === 'result'">
                    <div>
                      <template x-if="rev.result.warnings && rev.result.warnings.length">
                        <div class="notice warn mb05">
                          <template x-for="w in rev.result.warnings" :key="w">
                            <div x-text="'• ' + w"></div>
                          </template>
                        </div>
                      </template>
                      <template x-if="rev.role === 'iran'">
                        <div>
                          <div class="row mb05">
                            <span class="pill ok"><span class="dot"></span>entry node configured</span>
                            <span class="pill idle mono" x-text="'frps@' + rev.result.server.name + ' · ' + rev.result.server.bindAddr + ':' + rev.result.server.bindPort"></span>
                            <span class="pill" :class="rev.result.watchdog && rev.result.watchdog.enabled ? 'ok' : 'idle'"
                                  x-text="rev.result.watchdog && rev.result.watchdog.enabled ? 'watchdog on' : 'watchdog off'"></span>
                            <span class="pill idle mono" x-text="'verification: ' + rev.result.verify"></span>
                          </div>
                          <dl class="kv">
                            <dt>tunnel</dt><dd class="mono" x-text="rev.result.tunnel.iface + ' · ' + rev.result.tunnel.local_private_ip + ' ↔ ' + rev.result.tunnel.remote_private_ip"></dd>
                            <dt>token</dt><dd class="mono" x-text="rev.result.server.token"></dd>
                          </dl>
                          <template x-if="rev.result.unit_error || rev.result.tunnel_unit_error">
                            <div class="notice warn mt05">
                              <span x-text="'unit start failed: ' + (rev.result.unit_error || rev.result.tunnel_unit_error)"></span>
                            </div>
                          </template>
                          <p class="navgroup-label mt1">mirror payload — paste on the Foreign node</p>
                          <pre class="logpane" x-text="rev.result.mirror_payload"></pre>
                          <div class="btn-row mt05">
                            <button class="btn" @click="revCopy(rev.result.mirror_payload)">copy payload</button>
                          </div>
                          <p class="navgroup-label mt1">CLI command — edit the ports on the Foreign node</p>
                          <pre class="logpane" x-text="rev.result.mirror_command"></pre>
                          <div class="btn-row mt05">
                            <button class="btn" @click="revCopy(rev.result.mirror_command)">copy command</button>
                          </div>
                          <p class="faint small mt05">
                            Next: run this wizard on the Foreign node, choose <strong>Foreign Node</strong>,
                            paste the payload, add the local ports, and run the link test.
                          </p>
                        </div>
                      </template>
                      <template x-if="rev.role === 'foreign'">
                        <div>
                          <div class="row mb05">
                            <span class="pill" :class="rev.result.link_test.ok ? 'ok' : 'warn'">
                              <span class="dot"></span>
                              <span x-text="rev.result.link_test.ok ? 'GRE + FRPC healthy' : 'created — link check needs attention'"></span>
                            </span>
                            <span class="pill" :class="rev.result.link_test.reachable ? 'ok' : 'bad'" x-text="rev.result.link_test.reachable ? 'peer reachable' : 'peer unreachable'"></span>
                            <span class="pill" :class="rev.result.link_test.frpc_active ? 'ok' : 'bad'" x-text="rev.result.link_test.frpc_unit + ' ' + (rev.result.link_test.frpc_active ? 'active' : 'inactive')"></span>
                            <span class="pill" :class="rev.result.watchdog && rev.result.watchdog.enabled ? 'ok' : 'idle'"
                                  x-text="rev.result.watchdog && rev.result.watchdog.enabled ? 'watchdog on' : 'watchdog off'"></span>
                            <template x-if="rev.result.link_test.rtt_ms !== undefined">
                              <span class="pill accent" x-text="'avg ' + FRP.fmtRtt(rev.result.link_test.rtt_ms)"></span>
                            </template>
                            <template x-if="rev.result.link_test.loss_pct !== undefined">
                              <span class="pill" :class="rev.result.link_test.loss_pct > 0 ? 'warn' : 'ok'" x-text="rev.result.link_test.loss_pct + '% loss'"></span>
                            </template>
                          </div>
                          <dl class="kv">
                            <dt>tunnel</dt><dd class="mono" x-text="rev.result.tunnel.iface + ' · ' + rev.result.tunnel.local_private_ip + ' ↔ ' + rev.result.tunnel.remote_private_ip"></dd>
                            <dt>frpc</dt><dd class="mono" x-text="'frpc@' + rev.result.client.name + ' → ' + rev.result.client.serverAddr + ':' + rev.result.client.serverPort"></dd>
                            <dt>proxies</dt><dd x-text="rev.result.client.proxies + ' rules · tls ' + (rev.result.client.tls ? 'on' : 'off')"></dd>
                          </dl>
                          <template x-if="rev.result.unit_error || rev.result.tunnel_unit_error">
                            <div class="notice warn mt05">
                              <span x-text="'unit start failed: ' + (rev.result.unit_error || rev.result.tunnel_unit_error)"></span>
                            </div>
                          </template>
                          <template x-if="rev.result.link_test.output">
                            <pre class="logpane mt05" x-text="rev.result.link_test.output"></pre>
                          </template>
                          <p class="faint small mt05">
                            Users now reach each exposed Foreign service at
                            <span class="mono">Iran Public IP:&lt;forwarded port&gt;</span> — the same port number
                            that was forwarded (for example <span class="mono">1.2.3.4:443</span>).
                          </p>
                        </div>
                      </template>
                      <div class="modal-foot">
                        <button type="button" class="btn ghost" @click="rev = null">Close</button>
                        <button type="button" class="btn" @click="revPickRole(rev.role)">Run again</button>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </section>
        </template>

        <!-- ================= FRP Servers ================= -->
        <template x-if="view === 'servers'">
          <section x-data="serversView">
            <div class="viewhead">
              <div>
                <h1>FRP Servers</h1>

              </div>
              <div class="grow"></div>
              <button class="btn primary" @click="openCreate()">+ New server</button>
            </div>

            <template x-if="loading"><p class="muted">loading…</p></template>

            <template x-if="!loading && !rows.length">
              <div class="empty">
                <div class="empty-ico">▤</div>

            <template x-if="rows.length">

                <table class="tbl">
                  <thead>
                    <tr>

                    <template x-for="r in rows" :key="r.name">
                      <tr>
                        <td>
                          <span class="mono" x-text="r.name"></span>
                          <template x-if="r.parseError"><span class="pill bad" title="the file no longer parses">parse error</span></template>
                          <template x-if="r.style === 'advanced' || r.style === 'template'">
                            <span class="pill warn" x-text="r.style + ' — raw edits only'"></span>
                          </template>
                        </td>
                        <td class="mono" x-text="FRP.fmtAddr(r.bindAddr, r.bindPort)"></td>
                        <td x-text="r.protocol"></td>
                        <td class="mono" x-text="r.webPort ? r.webPort : '—'"></td>
                        <td>
                          <span class="pill" :class="r.tokenSet ? 'ok' : 'bad'" x-text="r.tokenSet ? 'set' : 'missing'"></span>
                        </td>
                        <td><span class="pill" :class="FRP.unitPill(r.unit.active)" x-text="r.unit.active"></span></td>
                        <td><span class="pill" :class="r.unit.enabled === 'enabled' ? 'ok' : 'idle'" x-text="r.unit.enabled"></span></td>
                        <td>
                          <div class="btn-row">
                            <template x-if="r.unit.active === 'active'">
                              <button class="btn tiny" @click="action('frps@' + r.name, 'restart')">restart</button>
                            </template>
                            <template x-if="r.unit.active === 'active'">
                              <button class="btn tiny" @click="action('frps@' + r.name, 'stop')">stop</button>
                            </template>
                            <template x-if="r.unit.active !== 'active'">
                              <button class="btn tiny" @click="action('frps@' + r.name, 'start')">start</button>
                            </template>
                            <button class="btn tiny" @click="openEdit(r)">edit</button>
                            <button class="btn tiny" @click="regenerate(r)">retoken</button>
                            <button class="btn tiny ghost" @click="openRaw(r.name)">toml</button>
                            <button class="btn tiny danger" @click="remove(r)">delete</button>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>

            <!-- create wizard -->
            <template x-if="wiz">
              <div class="modal-back" @keydown.escape.window="wiz = null">
                <form class="modal" @submit.prevent="create()">
                  <div class="modal-head"><h2>New frps instance</h2></div>
                  <div class="field-row">
                    <div class="field">
                      <label>Instance name</label>
                      <input class="input mono" x-model="wiz.name" placeholder="server-7000 (auto from port)">
                    </div>
                    <div class="field">
                      <label>Bind port</label>
                      <input class="input mono" type="number" min="1" max="65535" x-model="wiz.bindPort">
                    </div>
                    <div class="field">
                      <label>QUIC/KCP port (protocol)</label>
                      <select class="select" x-model="wiz.protocol">
                        <option value="quic">quic (recommended)</option>
                        <option value="kcp">kcp</option>
                        <option value="none">none — plain TCP</option>
                      </select>
                    </div>
                  </div>
                  <div class="field mt1">
                    <label>Bind address</label>
                    <select class="select mono" x-model="wiz.bindAddr">
                      <template x-for="c in bindChoices()" :key="c.v">
                        <option :value="c.v" x-text="c.label"></option>
                      </template>
                    </select>
                    <span class="hint">Iran entry node: bind frps to the GRE IP (e.g. 10.100.111.2) so the control port is reachable only over gt11.</span>
                  </div>
                  <template x-if="wiz.bindAddr === 'custom'">
                    <div class="field mt05">
                      <label>Custom bind address</label>
                      <input class="input mono" x-model="wiz.customBind" placeholder="10.100.111.2">
                    </div>
                  </template>
                  <div class="field-row mt1">
                    <div class="field">
                      <label>Auth token (32 chars, crypto-random)</label>
                      <div class="tokfield">
                        <input class="input mono" x-model="wiz.token" :disabled="!wiz.genToken" spellcheck="false">
                        <button type="button" class="btn" :disabled="!wiz.genToken" @click="wiz.token = FRP.genToken()">↻</button>
                        <button type="button" class="btn" @click="copyTok(wiz.token)">copy</button>
                      </div>
                      <label class="check mt05"><input type="checkbox" x-model="wiz.genToken"> generate a fresh token</label>
                    </div>
                  </div>
                  <div class="row mt1">
                    <label class="check"><input type="checkbox" x-model="wiz.tcpMux"> enable tcpMux</label>
                    <label class="check"><input type="checkbox" x-model="wiz.webEnabled"> metrics webServer (127.0.0.1, auto port 7500+)</label>
                  </div>
                  <template x-if="wiz.error"><div class="notice bad mt05"><span x-text="wiz.error"></span></div></template>
                  <div class="modal-foot">
                    <button type="button" class="btn ghost" @click="wiz = null">Cancel</button>
                    <button type="submit" class="btn primary" :disabled="wiz.busy">Create instance</button>
                  </div>
                </form>
              </div>
            </template>

            <!-- edit (managed configs) -->
            <template x-if="edit">
              <div class="modal-back" @keydown.escape.window="edit = null">
                <form class="modal" @submit.prevent="saveEdit()">
                  <div class="modal-head">
                    <h2 x-text="'Edit frps@' + edit.name"></h2>
                    <template x-if="edit.style !== 'managed'">
                      <span class="pill warn" x-text="edit.style + ' — use the TOML editor'"></span>
                    </template>
                  </div>
                  <div class="field-row">
                    <div class="field">
                      <label>Bind port</label>
                      <input class="input mono" type="number" min="1" max="65535" x-model="edit.bindPort">
                    </div>
                    <div class="field">
                      <label>Protocol</label>
                      <select class="select" x-model="edit.protocol">
                        <option value="quic">quic</option>
                        <option value="kcp">kcp</option>
                        <option value="none">none — plain TCP</option>
                      </select>
                    </div>
                  </div>
                  <div class="field mt05">
                    <label>Bind address</label>
                    <select class="select mono" x-model="edit.bindAddr">
                      <template x-for="c in bindChoices()" :key="c.v">
                        <option :value="c.v" x-text="c.label"></option>
                      </template>
                    </select>
                    <span class="hint">Iran entry node: the GRE IP (10.100.111.2) keeps frps off the public internet.</span>
                  </div>
                  <template x-if="edit.bindAddr === 'custom'">
                    <div class="field mt05">
                      <label>Custom bind address</label>
                      <input class="input mono" x-model="edit.customBind">
                    </div>
                  </template>
                  <div class="field mt05">
                    <label>Auth token</label>
                    <div class="tokfield">
                      <input class="input mono" x-model="edit.token" spellcheck="false">
                      <button type="button" class="btn" @click="retoken()">↻</button>
                      <button type="button" class="btn" @click="copyTok(edit.token)">copy</button>
                    </div>
                  </div>
                  <div class="row mt05">
                    <label class="check"><input type="checkbox" x-model="edit.tcpMux"> enable tcpMux</label>
                  </div>
                  <template x-if="edit.error"><div class="notice bad mt05"><span x-text="edit.error"></span></div></template>
                  <div class="modal-foot">
                    <button type="button" class="btn ghost" @click="edit = null">Cancel</button>
                    <button type="submit" class="btn primary" :disabled="edit.busy">Save (verify + .bak)</button>
                  </div>
                </form>
              </div>
            </template>

            <!-- raw TOML editor -->
            <template x-if="raw">
              <div class="modal-back" @keydown.escape.window="raw = null">
                <div class="modal">
                  <div class="modal-head">
                    <h2 x-text="'TOML — frps@' + raw.name"></h2>
                    <span class="pill" :class="raw.style === 'managed' ? 'ok' : 'warn'" x-text="raw.style"></span>
                  </div>
                  <textarea class="input rawedit" x-model="raw.content" spellcheck="false"></textarea>
                  <template x-if="raw.error"><div class="notice bad mt05"><span class="mono" x-text="raw.error"></span></div></template>
                  <template x-if="raw.saved"><div class="notice accent mt05"><span class="mono" x-text="raw.saved"></span></div></template>
                  <div class="modal-foot">
                    <button class="btn ghost" @click="raw = null">Close</button>
                    <button class="btn primary" :disabled="raw.busy" @click="saveRaw()">Save (verify + .bak)</button>
                  </div>
                </div>
              </div>
            </template>

            <!-- regenerated token -->
            <template x-if="regen">
              <div class="modal-back" @keydown.escape.window="regen = null">
                <div class="modal">
                  <div class="modal-head"><h2 x-text="'New token — frps@' + regen.name"></h2></div>
                  <div class="tokfield">
                    <input class="input mono" x-model="regen.token" readonly>
                    <button class="btn" @click="copyTok(regen.token)">copy</button>
                  </div>
                  <p class="muted small mt05" x-show="regen.propagated.length" x-cloak
                     x-text="'propagated to local clients: ' + regen.propagated.join(', ')"></p>
                  <p class="muted small mt05" x-show="!regen.propagated.length" x-cloak>
                    No local client config used the old token — remote clients must be updated by hand.
                  </p>
                  <div class="modal-foot">
                    <button class="btn primary" @click="regen = null">Done</button>
                  </div>
                </div>
              </div>
            </template>

            <!-- token shown once after create -->
            <template x-if="once">
              <div class="modal-back">
                <div class="modal">
                  <div class="modal-head"><h2 x-text="once.title"></h2></div>
                  <p class="muted small">Copy the token now — it is the credential your clients will use.</p>
                  <div class="tokfield">
                    <input class="input mono" x-model="once.token" readonly>
                    <button class="btn" @click="copyTok(once.token)">copy</button>
                  </div>
                  <template x-if="once.webPort">
                    <dl class="kv mt1">
                      <dt>metrics webServer</dt><dd x-text="'127.0.0.1:' + once.webPort"></dd>
                      <template x-if="once.webUser"><dt>dashboard login</dt><dd x-text="once.webUser + ' / ' + (once.webPassword || '')"></dd></template>
                    </dl>
                  </template>
                  <template x-if="once.note"><div class="notice warn mt05"><span x-text="once.note"></span></div></template>
                  <p class="faint small mt05" x-text="'verify: ' + once.verify + ' · backup: ' + (once.backup || 'n/a')"></p>
                  <div class="modal-foot">
                    <button class="btn primary" @click="once = null">Done</button>
                  </div>
                </div>
              </div>
            </template>
          </section>
        </template>

        <!-- ================= FRP Clients ================= -->
        <template x-if="view === 'clients'">
          <section x-data="clientsView">
            <div class="viewhead">
              <div>
                <h1>FRP Clients</h1>
                <p>frpc instances in <span class="mono">/root/frp/client/*.toml</span>, run as <span class="mono">frpc@&lt;name&gt;</span>.</p>
              </div>
              <div class="grow"></div>
              <button class="btn primary" @click="openCreate()">+ New client</button>
            </div>

            <template x-if="loading"><p class="muted">loading…</p></template>

            <template x-if="!loading && !rows.length">
              <div class="empty">
                <div class="empty-ico">▥</div>
                <p>No frpc instance on this node yet.</p>
                <button class="btn primary" @click="openCreate()">Create the first client</button>
              </div>
            </template>

            <div class="stack">
              <template x-for="r in rows" :key="r.name">
                <div class="card">
                  <div class="card-head">
                    <span class="badge cli" x-text="'frpc@' + r.name"></span>
                    <span class="pill" :class="FRP.unitPill(r.unit.active)" x-text="r.unit.active"></span>
                    <template x-if="r.style === 'advanced' || r.style === 'template'">
                      <span class="pill warn" x-text="r.style + ' — raw edits only'"></span>
                    </template>
                    <div class="grow"></div>
                    <span class="muted small mono" x-text="FRP.fmtAddr(r.serverAddr, r.serverPort) + ' · ' + (r.protocol || 'tcp')"></span>
                  </div>

                  <div class="row mb05">
                    <span class="pill" :class="r.tls ? 'ok' : 'warn'" x-text="r.tls ? 'tls on' : 'tls off'"></span>
                    <span class="pill idle" x-text="'mux ' + (r.tcpMux ? 'on' : 'off')"></span>
                    <span class="pill idle" x-text="r.proxies.length + ' proxies'"></span>
                    <div class="grow"></div>
                    <div class="btn-row">
                      <template x-if="r.unit.active === 'active'">
                        <button class="btn tiny" @click="action('frpc@' + r.name, 'restart')">restart</button>
                      </template>
                      <template x-if="r.unit.active === 'active'">
                        <button class="btn tiny" @click="action('frpc@' + r.name, 'stop')">stop</button>
                      </template>
                      <template x-if="r.unit.active !== 'active'">
                        <button class="btn tiny" @click="action('frpc@' + r.name, 'start')">start</button>
                      </template>
                      <button class="btn tiny" @click="toggleExpand(r.name)" x-text="expanded === r.name ? 'hide ports' : 'ports'"></button>
                      <button class="btn tiny" @click="openEdit(r)">edit</button>
                      <button class="btn tiny ghost" @click="openRaw(r.name)">toml</button>
                      <button class="btn tiny danger" @click="remove(r)">delete</button>
                    </div>
                  </div>

                  <!-- proxies -->
                  <template x-if="expanded === r.name">
                    <div>
                      <div class="tblwrap">
                        <table class="tbl">
                          <thead>
                            <tr><th>proxy</th><th>type</th><th>local</th><th>remote port</th><th></th></tr>
                          </thead>

                            <template x-for="p in r.proxies" :key="p.name">
                              <tr>
                                <td class="mono" x-text="p.name"></td>
                                <td><span class="badge" :class="p.type === 'udp' ? 'udp' : 'tcp'" x-text="p.type.toUpperCase()"></span></td>
                                <td class="mono" x-text="p.localIp + ':' + p.localPort"></td>
                                <td class="num" x-text="p.remotePort"></td>
                                <td><button class="btn tiny danger" @click="removeProxy(r, p)">remove</button></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>

                      <template x-if="addForm && addForm.name === r.name">
                        <form class="card mt05" @submit.prevent="addProxies()">
                          <div class="field-row">
                            <div class="field">
                              <label>Ports / ranges</label>
                              <input class="input mono" x-model="addForm.ports" placeholder="22, 6000-6006">
                            </div>
                            <div class="field">
                              <label>Emit</label>
                              <select class="select" x-model="addForm.proto">
                                <option value="both">TCP + UDP (paired rules)</option>
                                <option value="tcp">TCP only</option>
                                <option value="udp">UDP only</option>
                              </select>
                            </div>
                            <div class="field">
                              <label>Local IP</label>
                              <input class="input mono" x-model="addForm.localIp">
                            </div>
                          </div>
                          <template x-if="addForm.error"><div class="notice bad mt05"><span x-text="addForm.error"></span></div></template>
                          <div class="row end mt05">
                            <button type="button" class="btn ghost" @click="addForm = null">Cancel</button>
                            <button type="submit" class="btn primary" :disabled="addForm.busy">Add rules</button>
                          </div>
                        </form>
                      </template>
                      <template x-if="!addForm || addForm.name !== r.name">
                        <button class="btn sm mt05" @click="openAdd(r.name)">+ Add port rules</button>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <!-- create wizard -->
            <template x-if="wiz">
              <div class="modal-back" @keydown.escape.window="wiz = null">
                <form class="modal" @submit.prevent="create()">
                  <div class="modal-head"><h2>New frpc instance</h2></div>
                  <div class="field-row">
                    <div class="field">
                      <label>Instance name</label>
                      <input class="input mono" x-model="wiz.name" placeholder="client-7000 (auto from port)">
                    </div>
                    <div class="field">
                      <label>Server address</label>
                      <input class="input mono" x-model="wiz.serverAddr" placeholder="10.100.111.2 or public IP">
                      <span class="hint">Foreign exit node: use the Iran tunnel IP (10.100.111.2) so frpc dials back over gt11.</span>
                    </div>
                    <div class="field">
                      <label>Server port</label>
                      <input class="input mono" type="number" min="1" max="65535" x-model="wiz.serverPort">
                    </div>
                  </div>
                  <div class="field mt05">
                    <label>Auth token</label>
                    <select class="select mono" x-model="wiz.tokenSource" @change="pickToken(wiz.tokenSource)">

                        <option :value="s.v" x-text="s.label"></option>
                      </template>
                    </select>
                    <template x-if="wiz.tokenSource === 'paste'">
                      <input class="input mono mt05" x-model="wiz.token" placeholder="paste the server token" spellcheck="false">
                    </template>
                  </div>
                  <div class="field-row mt05">
                    <div class="field">
                      <label>Transport protocol</label>
                      <select class="select" x-model="wiz.protocol">
                        <option value="tcp">tcp</option>
                        <option value="websocket">websocket</option>
                        <option value="quic">quic</option>
                        <option value="kcp">kcp</option>
                      </select>
                    </div>
                    <div class="field">
                      <label>Local IP for proxies</label>
                      <input class="input mono" x-model="wiz.localIp">
                    </div>
                  </div>
                  <div class="field mt05">
                    <label>Ports / ranges</label>
                    <input class="input mono" x-model="wiz.ports" placeholder="22, 6000-6006">

                  </div>
                  <div class="field mt05">
                    <label>Protocol emission</label>
                    <select class="select" x-model="wiz.proto">
                      <option value="both">TCP + UDP — dual rules per port</option>

                      <option value="udp">UDP only</option>
                    </select>
                  </div>
                  <div class="row mt1">

                  <template x-if="wiz.error"><div class="notice bad mt05"><span x-text="wiz.error"></span></div></template>
                  <div class="modal-foot">
                    <button type="button" class="btn ghost" @click="wiz = null">Cancel</button>
                    <button type="submit" class="btn primary" :disabled="wiz.busy">Create instance</button>
                  </div>
                </form>
              </div>
            </template>

            <!-- edit -->
            <template x-if="edit">
              <div class="modal-back" @keydown.escape.window="edit = null">
                <form class="modal" @submit.prevent="saveEdit()">
                  <div class="modal-head"><h2 x-text="'Edit frpc@' + edit.name"></h2></div>
                  <div class="field-row">
                    <div class="field">
                      <label>Server address</label>
                      <input class="input mono" x-model="edit.serverAddr">
                    </div>
                    <div class="field">
                      <label>Server port</label>
                      <input class="input mono" type="number" min="1" max="65535" x-model="edit.serverPort">
                    </div>
                    <div class="field">
                      <label>Transport protocol</label>
                      <select class="select" x-model="edit.protocol">
                        <option value="tcp">tcp</option>
                        <option value="websocket">websocket</option>
                        <option value="quic">quic</option>
                        <option value="kcp">kcp</option>
                      </select>
                    </div>
                  </div>
                  <div class="field mt05">
                    <label>Auth token (leave blank to keep)</label>
                    <input class="input mono" x-model="edit.token" placeholder="unchanged" spellcheck="false">
                  </div>
                  <div class="row mt1">
                    <label class="check"><input type="checkbox" x-model="edit.useTls"> transport TLS</label>
                    <label class="check"><input type="checkbox" x-model="edit.useCompression"> compression</label>
                    <label class="check"><input type="checkbox" x-model="edit.tcpMux"> tcpMux</label>
                  </div>
                  <template x-if="edit.error"><div class="notice bad mt05"><span x-text="edit.error"></span></div></template>
                  <div class="modal-foot">
                    <button type="button" class="btn ghost" @click="edit = null">Cancel</button>
                    <button type="submit" class="btn primary" :disabled="edit.busy">Save (verify + .bak)</button>
                  </div>
                </form>
              </div>
            </template>

              <div class="modal-back" @keydown.escape.window="raw = null">

                    <h2 x-text="'TOML — frpc@' + raw.name"></h2>
